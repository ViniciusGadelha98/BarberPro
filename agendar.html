<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agende seu Horário</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 520px;
            width: 100%;
        }

        /* Card principal */
        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 28px 24px;
            margin-bottom: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(0, 0, 0, 0.02);
            transition: all 0.2s;
        }
        .card-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .card-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .card-header h1 i {
            color: #f59e0b;
        }
        .card-header p {
            color: #64748b;
            font-size: 0.95rem;
            margin-top: 4px;
        }

        .barber-name {
            font-size: 1.1rem;
            font-weight: 500;
            color: #0f172a;
            background: #f1f5f9;
            padding: 8px 16px;
            border-radius: 40px;
            display: inline-block;
            margin-top: 8px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            color: #334155;
            margin: 18px 0 6px;
        }
        label i {
            margin-right: 8px;
            color: #f59e0b;
            width: 18px;
        }

        input, select {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            font-size: 1rem;
            transition: 0.2s;
            background: #fafbfc;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #f59e0b;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.1);
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            background: #0f172a;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 8px;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn-primary {
            background: #0f172a;
        }
        .btn-primary:hover {
            background: #1e293b;
        }
        .btn-success {
            background: #10b981;
        }
        .btn-success:hover {
            background: #059669;
        }
        .btn:disabled {
            opacity: 0.6;
            pointer-events: none;
        }

        /* Horários */
        #horariosContainer {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 14px;
        }
        .horario-livre {
            background: #f1f5f9;
            color: #0f172a;
            border: 2px solid transparent;
            padding: 12px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.15s;
            flex: 1 0 calc(33% - 10px);
            text-align: center;
            min-width: 70px;
        }
        .horario-livre:hover {
            background: #e2e8f0;
            transform: translateY(-2px);
        }
        .horario-livre.selecionado {
            background: #0f172a;
            color: white;
            border-color: #0f172a;
        }
        .horario-livre:disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        .sem-horarios {
            color: #94a3b8;
            font-size: 0.95rem;
            padding: 20px 0;
            text-align: center;
        }

        /* Formulário de agendamento */
        #formAgendamento {
            margin-top: 4px;
        }
        #formAgendamento h3 {
            font-size: 1.2rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #formAgendamento h3 i {
            color: #f59e0b;
        }

        .campo-obrigatorio::after {
            content: " *";
            color: #ef4444;
        }

        .msg-erro {
            color: #ef4444;
            font-size: 0.9rem;
            margin-top: 8px;
        }
        .msg-sucesso {
            color: #10b981;
            font-size: 0.95rem;
            font-weight: 500;
            background: #ecfdf5;
            padding: 14px 16px;
            border-radius: 12px;
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .msg-sucesso i {
            font-size: 1.4rem;
        }
        .hidden {
            display: none !important;
        }

        .texto-ajuda {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 4px;
        }

        .footer {
            text-align: center;
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #e2e8f0;
        }
        .footer i {
            color: #f59e0b;
        }

        /* Responsivo */
        @media (max-width: 480px) {
            .card { padding: 20px 16px; }
            .horario-livre { flex: 1 0 calc(50% - 10px); }
            .card-header h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- Cabeçalho -->
        <div class="card">
            <div class="card-header">
                <h1><i class="fas fa-cut"></i> Agende seu Corte</h1>
                <p>Escolha o serviço, a data e o horário</p>
                <div class="barber-name" id="barberShopDisplay">✂️ BarberPro</div>
            </div>
        </div>

        <!-- Escolha do serviço e data -->
        <div class="card">
            <label><i class="fas fa-scissors"></i> Serviço</label>
            <select id="servicoSelect"><option value="">Carregando...</option></select>

            <label><i class="fas fa-calendar-day"></i> Data</label>
            <input type="date" id="dataSelect" min="">

            <button class="btn btn-primary" id="btnBuscar" onclick="buscarHorarios()">
                <i class="fas fa-search"></i> Ver horários
            </button>

            <div id="horariosContainer"></div>
        </div>

        <!-- Formulário do cliente -->
        <div class="card hidden" id="formAgendamento">
            <h3><i class="fas fa-user-plus"></i> Preencha seus dados</h3>

            <label class="campo-obrigatorio"><i class="fas fa-user"></i> Seu nome</label>
            <input type="text" id="cliNome" placeholder="Digite seu nome completo">

            <label class="campo-obrigatorio"><i class="fas fa-phone"></i> Telefone</label>
            <input type="text" id="cliTelefone" placeholder="(XX) XXXXX-XXXX" oninput="mascaraTelefone(this)" maxlength="16">
            <div class="texto-ajuda">Precisamos do telefone para confirmar seu agendamento.</div>

            <label><i class="fas fa-comment"></i> Observações (opcional)</label>
            <input type="text" id="cliObs" placeholder="Ex: prefiro horário mais cedo, tenho barba grande...">

            <button class="btn btn-success" id="btnConfirmar" onclick="confirmarAgendamento()">
                <i class="fas fa-check-circle"></i> Confirmar Agendamento
            </button>

            <div id="msgErro" class="msg-erro"></div>
            <div id="msgSucesso" class="msg-sucesso hidden">
                <i class="fas fa-check-circle"></i>
                <span id="msgSucessoTexto"></span>
            </div>
        </div>

        <div class="footer">
            <i class="fas fa-cut"></i> Sistema de agendamento • BarberPro
        </div>
    </div>

    <script>
        // ========== CONFIGURAÇÃO SUPABASE ==========
        const SUPABASE_URL = 'https://yywmylgsmcwrfmzkmmoz.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_hGOH6BoUMcRC2av-xAD26Q_YJRFQFY0';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ========== VARIÁVEIS GLOBAIS ==========
        let horarioSelecionado = null;
        let servicoSelecionado = null;
        let dataSelecionada = '';
        let horariosDisponiveis = [];

        // ========== CARREGAR NOME DA BARBEARIA ==========
        async function carregarNomeBarbearia() {
            const nome = localStorage.getItem('barberShopName') || '✂️ BarberPro';
            document.getElementById('barberShopDisplay').textContent = nome;
        }

        // ========== CARREGAR SERVIÇOS ATIVOS ==========
        async function carregarServicos() {
            const { data, error } = await supabase
                .from('servicos')
                .select('id, nome, preco, tempo')
                .eq('status', 'ativo')
                .order('nome');
            if (error) {
                console.error(error);
                document.getElementById('servicoSelect').innerHTML = '<option value="">Erro ao carregar</option>';
                return;
            }
            const sel = document.getElementById('servicoSelect');
            sel.innerHTML = '<option value="">-- Selecione um serviço --</option>';
            if (data && data.length > 0) {
                data.forEach(s => {
                    sel.innerHTML += `<option value="${s.id}" data-tempo="${s.tempo || 30}">${s.nome} (${s.tempo||30}min - R$ ${parseFloat(s.preco||0).toFixed(2).replace('.', ',')})</option>`;
                });
            } else {
                sel.innerHTML = '<option value="">Nenhum serviço ativo</option>';
            }
        }

        // ========== BUSCAR HORÁRIOS ==========
        async function buscarHorarios() {
            const data = document.getElementById('dataSelect').value;
            const servicoId = document.getElementById('servicoSelect').value;
            if (!data || !servicoId) {
                alert('Selecione um serviço e uma data.');
                return;
            }

            // Mostrar loading
            const btn = document.getElementById('btnBuscar');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Buscando...';

            dataSelecionada = data;
            const sel = document.getElementById('servicoSelect');
            const tempo = parseInt(sel.options[sel.selectedIndex]?.dataset.tempo) || 30;
            servicoSelecionado = { id: servicoId, tempo };

            // 1. Buscar disponibilidade
            const diaSemana = new Date(data + 'T00:00:00').getDay();
            const { data: disp, error: e1 } = await supabase
                .from('disponibilidade')
                .select('*')
                .or(`dia_semana.eq.${diaSemana}, data_especifica.eq.${data}`)
                .eq('ativo', true);

            if (e1 || !disp || disp.length === 0) {
                document.getElementById('horariosContainer').innerHTML = '<div class="sem-horarios">😕 Nenhum atendimento disponível neste dia.</div>';
                document.getElementById('formAgendamento').classList.add('hidden');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-search"></i> Ver horários';
                return;
            }

            // 2. Buscar agendamentos existentes (não cancelados)
            const { data: agendamentos, error: e2 } = await supabase
                .from('agendamentos')
                .select('id, hora, servico_id')
                .eq('data', data)
                .not('status', 'eq', 'cancelado');
            if (e2) console.error(e2);

            // 3. Gerar slots livres
            const slots = [];
            disp.forEach(d => {
                const inicio = d.hora_inicio.split(':').map(Number);
                const fim = d.hora_fim.split(':').map(Number);
                const intervalo = d.intervalo || 60;
                let horaAtual = new Date(1970, 0, 1, inicio[0], inicio[1]);
                const horaFim = new Date(1970, 0, 1, fim[0], fim[1]);

                while (horaAtual < horaFim) {
                    const horaStr = horaAtual.toTimeString().slice(0, 5);
                    let conflito = false;
                    for (let a of agendamentos) {
                        const aHora = new Date(1970, 0, 1, ...a.hora.split(':').map(Number));
                        const aDur = 30; // simplificado, mas você pode buscar a duração real
                        const aFim = new Date(aHora.getTime() + aDur * 60000);
                        const slotFim = new Date(horaAtual.getTime() + tempo * 60000);
                        if ( (horaAtual < aFim && slotFim > aHora) ) {
                            conflito = true;
                            break;
                        }
                    }
                    if (!conflito) slots.push(horaStr);
                    horaAtual.setMinutes(horaAtual.getMinutes() + intervalo);
                }
            });

            const container = document.getElementById('horariosContainer');
            if (slots.length === 0) {
                container.innerHTML = '<div class="sem-horarios">⏰ Nenhum horário disponível para este serviço neste dia.</div>';
                document.getElementById('formAgendamento').classList.add('hidden');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-search"></i> Ver horários';
                return;
            }

            // Exibir horários
            horariosDisponiveis = slots;
            container.innerHTML = slots.map(h =>
                `<button class="horario-livre" data-hora="${h}" onclick="selecionarHorario(this, '${h}')">${h}</button>`
            ).join('');

            // Mostrar formulário
            document.getElementById('formAgendamento').classList.remove('hidden');
            document.getElementById('msgErro').textContent = '';
            document.getElementById('msgSucesso').classList.add('hidden');
            horarioSelecionado = null;

            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-search"></i> Ver horários';
        }

        // ========== SELECIONAR HORÁRIO ==========
        function selecionarHorario(btn, hora) {
            document.querySelectorAll('.horario-livre').forEach(b => b.classList.remove('selecionado'));
            btn.classList.add('selecionado');
            horarioSelecionado = hora;
        }

        // ========== CONFIRMAR AGENDAMENTO ==========
        async function confirmarAgendamento() {
            const nome = document.getElementById('cliNome').value.trim();
            const telefone = document.getElementById('cliTelefone').value.trim();
            const obs = document.getElementById('cliObs').value.trim();
            const data = dataSelecionada;

            if (!nome || !telefone || !horarioSelecionado) {
                document.getElementById('msgErro').textContent = '⚠️ Preencha nome, telefone e selecione um horário.';
                return;
            }
            document.getElementById('msgErro').textContent = '';

            // Desabilitar botão para evitar duplo clique
            const btnConfirm = document.getElementById('btnConfirmar');
            btnConfirm.disabled = true;
            btnConfirm.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Confirmando...';

            // Verificar se o horário ainda está livre (conflito)
            const { data: agendamentos, error: eAg } = await supabase
                .from('agendamentos')
                .select('id, hora, servico_id')
                .eq('data', data)
                .not('status', 'eq', 'cancelado');
            if (eAg) {
                alert('Erro ao verificar horário.');
                btnConfirm.disabled = false;
                btnConfirm.innerHTML = '<i class="fas fa-check-circle"></i> Confirmar Agendamento';
                return;
            }

            let conflito = false;
            const tempo = servicoSelecionado.tempo;
            const horaSel = new Date(1970, 0, 1, ...horarioSelecionado.split(':').map(Number));
            const fimSel = new Date(horaSel.getTime() + tempo * 60000);
            for (let a of agendamentos) {
                const aHora = new Date(1970, 0, 1, ...a.hora.split(':').map(Number));
                const aDur = 30;
                const aFim = new Date(aHora.getTime() + aDur * 60000);
                if ( (horaSel < aFim && fimSel > aHora) ) {
                    conflito = true;
                    break;
                }
            }

            if (conflito) {
                document.getElementById('msgErro').textContent = '⚠️ Este horário acabou de ser ocupado. Escolha outro.';
                buscarHorarios();
                btnConfirm.disabled = false;
                btnConfirm.innerHTML = '<i class="fas fa-check-circle"></i> Confirmar Agendamento';
                return;
            }

            // Buscar ou criar cliente
            let clienteId = null;
            const { data: clientes, error: eC } = await supabase
                .from('clientes')
                .select('id')
                .eq('nome', nome)
                .eq('telefone', telefone);
            if (eC) {
                alert('Erro ao buscar cliente.');
                btnConfirm.disabled = false;
                btnConfirm.innerHTML = '<i class="fas fa-check-circle"></i> Confirmar Agendamento';
                return;
            }

            if (clientes && clientes.length > 0) {
                clienteId = clientes[0].id;
            } else {
                const novoCliente = {
                    id: crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(),
                    nome: nome,
                    telefone: telefone,
                    creditos: 0,
                    data_cadastro: new Date().toISOString(),
                    obs: obs // salva a observação no cadastro do cliente
                };
                const { error: eI } = await supabase.from('clientes').insert([novoCliente]);
                if (eI) {
                    alert('Erro ao criar cliente: ' + eI.message);
                    btnConfirm.disabled = false;
                    btnConfirm.innerHTML = '<i class="fas fa-check-circle"></i> Confirmar Agendamento';
                    return;
                }
                clienteId = novoCliente.id;
            }

            // Criar agendamento
            const agendamento = {
                id: crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(),
                cliente_id: clienteId,
                servico_id: servicoSelecionado.id,
                data: data,
                hora: horarioSelecionado,
                status: 'agendado',
                origem: 'publico',
                observacao: obs || null,
                criado_em: new Date().toISOString()
            };
            const { error: eA } = await supabase.from('agendamentos').insert([agendamento]);
            if (eA) {
                alert('Erro ao agendar: ' + eA.message);
                btnConfirm.disabled = false;
                btnConfirm.innerHTML = '<i class="fas fa-check-circle"></i> Confirmar Agendamento';
                return;
            }

            // Sucesso
            document.getElementById('msgSucessoTexto').textContent =
                `✅ Agendamento confirmado para ${data} às ${horarioSelecionado}! Enviaremos um lembrete.`;
            document.getElementById('msgSucesso').classList.remove('hidden');
            document.getElementById('msgSucesso').style.display = 'flex';

            // Limpar e desabilitar
            document.querySelectorAll('.horario-livre').forEach(b => b.disabled = true);
            btnConfirm.disabled = true;
            btnConfirm.style.opacity = '0.6';
            btnConfirm.innerHTML = '<i class="fas fa-check-circle"></i> Agendado';

            // Ocultar botão de buscar?
            // Não, mas pode deixar como está
        }

        // ========== MÁSCARA TELEFONE ==========
        function mascaraTelefone(el) {
            let v = el.value.replace(/\D/g, '');
            if (v.length <= 2) el.value = v;
            else if (v.length <= 7) el.value = '(' + v.substring(0, 2) + ') ' + v.substring(2);
            else el.value = '(' + v.substring(0, 2) + ') ' + v.substring(2, 7) + '-' + v.substring(7, 11);
        }

        // ========== INICIALIZAR ==========
        window.onload = function() {
            carregarNomeBarbearia();
            carregarServicos();
            const hoje = new Date().toISOString().split('T')[0];
            document.getElementById('dataSelect').min = hoje;
            document.getElementById('dataSelect').value = hoje;
        };
    </script>
</body>
</html>
