<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarberPro</title>
    <!-- LINK PARA O MANIFEST (necessário para o PWA) -->
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Inter', -apple-system, sans-serif;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
        }
        .icon {
            font-size: 4rem;
            color: #f59e0b;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        p {
            color: #94a3b8;
            margin-bottom: 20px;
            font-size: 1rem;
        }
        .btn {
            display: inline-block;
            padding: 14px 32px;
            background: #f59e0b;
            color: #0f172a;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 700;
            transition: 0.2s;
        }
        .btn:hover {
            transform: scale(1.02);
        }
        .btn i {
            margin-right: 8px;
        }
        .info {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">✂️</div>
        <h1>BarberPro</h1>
        <p>Agende seu horário de forma rápida e fácil</p>
        <a href="/agendar.html" class="btn">
            <i class="fas fa-calendar-check"></i> Agendar Corte
        </a>
        <div class="info">Baixe o app para agendar mais rápido</div>
    </div>

    <script>
        // SÓ REDIRECIONA SE O APP JÁ ESTIVER ABERTO COMO STANDALONE
        // Isso NÃO QUEBRA o PWA, porque o app já está no modo standalone
        if (window.matchMedia('(display-mode: standalone)').matches) {
            window.location.href = "/agendar.html";
        }
        // Para quem acessa pelo navegador normal, NÃO redireciona automaticamente
        // O usuário clica no botão "Agendar Corte" manualmente
    </script>
</body>
</html>
