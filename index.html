<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarberPro - Agendamento</title>
    <style>
        body {
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
        }
        .container i {
            font-size: 4rem;
            color: #f59e0b;
            margin-bottom: 20px;
        }
        .container h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .container p {
            color: #94a3b8;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            padding: 14px 32px;
            background: #f59e0b;
            color: #0f172a;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 700;
            transition: 0.2s;
        }
        .btn:hover {
            transform: scale(1.02);
        }
        .loading {
            margin-top: 20px;
            color: #64748b;
            font-size: 0.9rem;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <i class="fas fa-cut"></i>
        <h1>BarberPro</h1>
        <p>Agende seu horário de forma rápida e fácil</p>
        <a href="/agendar.html" class="btn"><i class="fas fa-calendar-check"></i> Agendar Corte</a>
        <div class="loading">Redirecionando...</div>
    </div>
    <script>
        // Redireciona automaticamente para a página de agendamento público
        window.location.href = "/agendar.html";
    </script>
</body>
</html>
